name: Live smoke

# Runs generated commands against a real LangSmith workspace. Inactive until
# the LANGSMITH_SMOKE_API_KEY secret is configured.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      writes:
        description: "Also create and delete a disabled automation rule"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: live-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_SMOKE_API_KEY }}
      LANGSMITH_ENDPOINT: ${{ vars.LANGSMITH_SMOKE_ENDPOINT }}
      LANGSMITH_SMOKE_QUEUE_ID: ${{ vars.LANGSMITH_SMOKE_QUEUE_ID }}
      LANGSMITH_SMOKE_PROJECT: ${{ vars.LANGSMITH_SMOKE_PROJECT }}
      # Scheduled runs are read-only; writes need a manual run with `writes` checked.
      LANGSMITH_SMOKE_WRITES: ${{ inputs.writes && vars.LANGSMITH_SMOKE_PROJECT != '' && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.7'

      - name: Skip without credentials
        id: creds
        run: |
          if [ -z "$LANGSMITH_API_KEY" ]; then
            echo "LANGSMITH_SMOKE_API_KEY is not configured; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Smoke test generated commands
        if: steps.creds.outputs.skip != 'true'
        run: go test -tags=integration -count=1 -v -run GeneratedSmokeIntegration ./internal/cmd/
