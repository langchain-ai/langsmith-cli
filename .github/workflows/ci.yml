name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            go-version: '1.23'
            build-output: langsmith
          - os: ubuntu-latest
            go-version: '1.24'
            build-output: langsmith
          - os: windows-latest
            go-version: '1.24'
            build-output: langsmith.exe
          - os: macos-latest
            go-version: '1.24'
            build-output: langsmith
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o ${{ matrix.build-output }} ./cmd/langsmith
        env:
          CGO_ENABLED: 0

  installer-smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Smoke test install.sh
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p "$RUNNER_TEMP/langsmith-bin"
          INSTALL_DIR="$RUNNER_TEMP/langsmith-bin" sh scripts/install.sh
          "$RUNNER_TEMP/langsmith-bin/langsmith" --version

      - name: Smoke test install.ps1
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "langsmith-bin"
          & .\scripts\install.ps1 -InstallDir $installDir
          & (Join-Path $installDir "langsmith.exe") --version

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      - name: Install golangci-lint (built with Go 1.26)
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8

      - name: Run lint
        run: golangci-lint run
