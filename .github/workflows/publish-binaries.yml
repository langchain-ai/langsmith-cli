name: Publish Binaries
on:
  workflow_dispatch:

permissions:
  contents: read

# One group per tag, so a second release's publish never replaces a queued one.
concurrency:
  group: publish-binaries-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # release-please dispatches this workflow at the new tag. GoReleaser builds
  # the binaries and attaches them to the release release-please created,
  # keeping its notes.
  goreleaser:
    if: github.repository == 'langchain-ai/langsmith-cli' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a vX.Y.Z tag" >&2
            exit 1
          fi
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease \
            --jq 'select(.isDraft == false and .isPrerelease == false)' | grep -q .

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bump-tap:
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions: {}
    env:
      HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: "Iv23liMFOFBcPTKFWi3S"
          private-key: ${{ secrets.LANGCHAIN_ACTIONS_PR_BOT_PRIVATE_KEY }}
          owner: langchain-ai
          repositories: homebrew-tap

      - name: Open bump PR against the tap
        uses: dawidd6/action-homebrew-bump-formula@b12d2bc99c46444125e606142f28200ec71a1214 # v10
        with:
          token: ${{ steps.app-token.outputs.token }}
          user_name: "langtions-bot[bot]"
          user_email: "261626216+langtions-bot[bot]@users.noreply.github.com"
          no_fork: true
          tap: langchain-ai/homebrew-tap
          formula: langsmith-cli
          tag: ${{ github.ref }}
