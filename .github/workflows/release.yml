name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # A release must use a released langsmith-go. Generated commands can be
      # merged while go.mod points at an unreleased commit (a pseudo-version)
      # or a replace; releasing then would ship SDK code that has no SDK release.
      - name: Require a released langsmith-go
        run: |
          module=github.com/langchain-ai/langsmith-go
          # go list fails when go.mod does not require the module; report that
          # with its own error. Any later go list failure fails the step.
          version=$(go list -m -f '{{.Version}}' "$module" 2>/dev/null || true)
          if [[ -z "$version" ]]; then
            echo "::error::go list found no $module requirement. Check that go.mod requires it, or update this check if the module path changed."
            exit 1
          fi
          replace=$(go list -m -f '{{with .Replace}}{{.Path}} {{.Version}}{{end}}' "$module")
          if [[ -n "$replace" ]]; then
            echo "::error::go.mod replaces langsmith-go with $replace. Remove the replace and require a released tag, then tag the CLI again."
            exit 1
          fi
          if [[ "$version" =~ [0-9]{14}-[0-9a-f]{12}$ ]]; then
            echo "::error::go.mod uses langsmith-go $version, an unreleased commit. Release langsmith-go, update go.mod to that tag, then tag the CLI again."
            exit 1
          fi
          echo "langsmith-go $version"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bump-tap:
    needs: release
    runs-on: ubuntu-latest
    permissions: {}
    env:
      HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: "Iv23liMFOFBcPTKFWi3S"
          private-key: ${{ secrets.LANGCHAIN_ACTIONS_PR_BOT_PRIVATE_KEY }}
          owner: langchain-ai
          repositories: homebrew-tap

      - name: Open bump PR against the tap
        uses: dawidd6/action-homebrew-bump-formula@b12d2bc99c46444125e606142f28200ec71a1214 # v10
        with:
          token: ${{ steps.app-token.outputs.token }}
          user_name: "langtions-bot[bot]"
          user_email: "261626216+langtions-bot[bot]@users.noreply.github.com"
          no_fork: true
          tap: langchain-ai/homebrew-tap
          formula: langsmith-cli
          tag: ${{ github.ref }}
