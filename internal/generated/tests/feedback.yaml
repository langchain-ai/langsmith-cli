# Tests for `langsmith feedback`. Contract cases run against a fake API.
resource: feedback

contract:
  - name: retrieve
    op: retrieve
    args: [--feedback-id, 11111111-1111-1111-1111-111111111111, --include-user-names, "true"]
    response:
      body: &feedback
        id: 11111111-1111-1111-1111-111111111111
        run_id: 22222222-2222-2222-2222-222222222222
        key: correctness
        score: 1
    want:
      method: GET
      path: /api/v1/feedback/11111111-1111-1111-1111-111111111111
      query: {include_user_names: "true"}
      stdout: correctness

  - name: retrieve in a workspace
    op: retrieve
    args: [--feedback-id, 11111111-1111-1111-1111-111111111111, --workspace, 44444444-4444-4444-4444-444444444444]
    response:
      body: *feedback
    want:
      method: GET
      path: /api/v1/feedback/11111111-1111-1111-1111-111111111111
      headers: {X-Tenant-Id: 44444444-4444-4444-4444-444444444444}
      stdout: correctness

  - name: retrieve reports API errors
    op: retrieve
    args: [--feedback-id, 11111111-1111-1111-1111-111111111111]
    response:
      status: 404
      body: {detail: Feedback not found}
    want:
      method: GET
      path: /api/v1/feedback/11111111-1111-1111-1111-111111111111
      exit_code: 1
      stderr: 404 Not Found

  # list follows offset pages until one is empty; --max-items stops it after the first item.
  - name: list feedback on one run
    op: list
    args: [--run, 22222222-2222-2222-2222-222222222222, --max-items, "1"]
    response:
      body: [*feedback]
    want:
      method: GET
      path: /api/v1/feedback
      query: {run: 22222222-2222-2222-2222-222222222222}
      stdout: correctness

  # List flags take a YAML list for several values; a repeated flag keeps only the last one.
  - name: list with every filter
    op: list
    args:
      - --run
      - '[22222222-2222-2222-2222-222222222222, 33333333-3333-3333-3333-333333333333]'
      - --key
      - '[correctness, helpfulness]'
      - --session
      - '[55555555-5555-5555-5555-555555555555]'
      - --source
      - '[api, model]'
      - --user
      - '[66666666-6666-6666-6666-666666666666]'
      - --has-comment
      - "true"
      - --has-score
      - "false"
      - --level
      - run
      - --min-created-at
      - "2026-01-01T00:00:00Z"
      - --max-created-at
      - "2026-02-01T00:00:00Z"
      - --include-user-names
      - "true"
      - --comparative-experiment-id
      - 77777777-7777-7777-7777-777777777777
      - --limit
      - "10"
      - --offset
      - "20"
      - --max-items
      - "1"
    response:
      body: [*feedback]
    want:
      method: GET
      path: /api/v1/feedback
      query:
        run: [22222222-2222-2222-2222-222222222222, 33333333-3333-3333-3333-333333333333]
        key: [correctness, helpfulness]
        session: 55555555-5555-5555-5555-555555555555
        source: [api, model]
        user: 66666666-6666-6666-6666-666666666666
        has_comment: "true"
        has_score: "false"
        level: run
        min_created_at: "2026-01-01T00:00:00Z"
        max_created_at: "2026-02-01T00:00:00Z"
        include_user_names: "true"
        comparative_experiment_id: 77777777-7777-7777-7777-777777777777
        limit: "10"
        offset: "20"
      stdout: correctness

  - name: list feedback on a thread
    op: list
    args: [--session, 55555555-5555-5555-5555-555555555555, --feedback-thread-id, thread-1]
    response:
      body: []
    want:
      method: GET
      path: /api/v1/feedback
      query: {session: 55555555-5555-5555-5555-555555555555, feedback_thread_id: thread-1}

  - name: list in a workspace
    op: list
    args: [--key, correctness, --workspace, 44444444-4444-4444-4444-444444444444, --max-items, "1"]
    response:
      body: [*feedback]
    want:
      method: GET
      path: /api/v1/feedback
      query: {key: correctness}
      headers: {X-Tenant-Id: 44444444-4444-4444-4444-444444444444}

  - name: list without run, key, or session reports the API error
    op: list
    args: [--has-score, "true"]
    response:
      status: 400
      body: {detail: "At least one of 'run', 'key', or 'session' must be provided."}
    want:
      method: GET
      path: /api/v1/feedback
      query: {has_score: "true"}
      exit_code: 1
      stderr: 400 Bad Request

  - name: create run feedback with every field
    op: create
    args:
      - --run-id
      - 22222222-2222-2222-2222-222222222222
      - --trace-id
      - 88888888-8888-8888-8888-888888888888
      - --session-id
      - 55555555-5555-5555-5555-555555555555
      - --start-time
      - "2026-01-01T00:00:00Z"
      - --id
      - 11111111-1111-1111-1111-111111111111
      - --key
      - correctness
      - --score
      - "-0.5"
      - --value
      - partial
      - --comment
      - Misses one step
      - --correction
      - '{answer: 42}'
      - --extra
      - '{reviewer: alice}'
      - --feedback-source
      - '{type: api}'
      - --feedback-config.type
      - continuous
      - --feedback-config.min
      - "-1"
      - --feedback-config.max
      - "1"
      - --feedback-group-id
      - 99999999-9999-9999-9999-999999999999
      - --comparative-experiment-id
      - 77777777-7777-7777-7777-777777777777
      - --extend-trace-retention=false
    response:
      body: *feedback
    want:
      method: POST
      path: /api/v1/feedback
      body:
        run_id: 22222222-2222-2222-2222-222222222222
        trace_id: 88888888-8888-8888-8888-888888888888
        session_id: 55555555-5555-5555-5555-555555555555
        start_time: "2026-01-01T00:00:00Z"
        id: 11111111-1111-1111-1111-111111111111
        key: correctness
        score: -0.5
        value: partial
        comment: Misses one step
        correction: {answer: 42}
        extra: {reviewer: alice}
        feedback_source: {type: api}
        feedback_config: {type: continuous, min: -1, max: 1}
        feedback_group_id: 99999999-9999-9999-9999-999999999999
        comparative_experiment_id: 77777777-7777-7777-7777-777777777777
        extend_trace_retention: false
      stdout: correctness

  # Runs after the case above, so it also shows flag values do not carry over.
  - name: create run feedback with a key and a boolean score
    op: create
    args: [--run-id, 22222222-2222-2222-2222-222222222222, --key, correctness, --score, "true"]
    response:
      body: *feedback
    want:
      method: POST
      path: /api/v1/feedback
      body: {run_id: 22222222-2222-2222-2222-222222222222, key: correctness, score: true}

  - name: create project feedback by project ID
    op: create
    args: [--project-id, 55555555-5555-5555-5555-555555555555, --key, quality, --score, "3"]
    response:
      body: *feedback
    want:
      method: POST
      path: /api/v1/feedback
      body: {session_id: 55555555-5555-5555-5555-555555555555, key: quality, score: 3}

  - name: create thread feedback with categories
    op: create
    args:
      - --session-id
      - 55555555-5555-5555-5555-555555555555
      - --feedback-thread-id
      - thread-1
      - --key
      - resolved
      - --value
      - "yes"
      - --feedback-config.type
      - categorical
      - --feedback-config.categories
      - '[{value: 1, label: "yes"}, {value: 0, label: "no"}]'
    response:
      body: *feedback
    want:
      method: POST
      path: /api/v1/feedback
      body:
        session_id: 55555555-5555-5555-5555-555555555555
        feedback_thread_id: thread-1
        key: resolved
        value: "yes"
        feedback_config:
          type: categorical
          categories: [{value: 1, label: "yes"}, {value: 0, label: "no"}]

  - name: create by Agent address in a workspace
    op: create
    args:
      - --address
      - lrn:agents/support-agent/environments/production
      - --key
      - correctness
      - --score
      - "1"
      - --workspace
      - 44444444-4444-4444-4444-444444444444
    response:
      body: *feedback
    want:
      method: POST
      path: /api/v1/feedback
      headers: {X-Tenant-Id: 44444444-4444-4444-4444-444444444444}
      body: {address: lrn:agents/support-agent/environments/production, key: correctness, score: 1}

  - name: create reports API errors
    op: create
    args: [--run-id, 22222222-2222-2222-2222-222222222222, --key, reserved-key]
    response:
      status: 403
      body: {detail: Feedback key 'reserved-key' is reserved for internal use}
    want:
      method: POST
      path: /api/v1/feedback
      body: {run_id: 22222222-2222-2222-2222-222222222222, key: reserved-key}
      exit_code: 1
      stderr: 403 Forbidden

  - name: update with every field
    op: update
    args:
      - --feedback-id
      - 11111111-1111-1111-1111-111111111111
      - --comment
      - Close, but misses one step
      - --correction
      - '{answer: 42}'
      - --score
      - "-0.5"
      - --value
      - partial
      - --feedback-config.type
      - continuous
      - --feedback-config.min
      - "-1"
      - --feedback-config.max
      - "1"
    response:
      body: *feedback
    want:
      method: PATCH
      path: /api/v1/feedback/11111111-1111-1111-1111-111111111111
      body:
        comment: Close, but misses one step
        correction: {answer: 42}
        score: -0.5
        value: partial
        feedback_config: {type: continuous, min: -1, max: 1}
      stdout: correctness

  # Runs after the case above, so it also shows flag values do not carry over.
  - name: update a boolean score and categories
    op: update
    args:
      - --feedback-id
      - 11111111-1111-1111-1111-111111111111
      - --score
      - "true"
      - --feedback-config.type
      - categorical
      - --feedback-config.categories
      - '[{value: 1, label: good}, {value: 0, label: bad}]'
    response:
      body: *feedback
    want:
      method: PATCH
      path: /api/v1/feedback/11111111-1111-1111-1111-111111111111
      body:
        score: true
        feedback_config:
          type: categorical
          categories: [{value: 1, label: good}, {value: 0, label: bad}]

  - name: update with one field
    op: update
    args: [--feedback-id, 11111111-1111-1111-1111-111111111111, --comment, Looks right]
    response:
      body: *feedback
    want:
      method: PATCH
      path: /api/v1/feedback/11111111-1111-1111-1111-111111111111
      body: {comment: Looks right}

  - name: delete after confirmation
    op: delete
    args: [--feedback-id, 11111111-1111-1111-1111-111111111111]
    stdin: "y\n"
    response:
      body: {}
    want:
      method: DELETE
      path: /api/v1/feedback/11111111-1111-1111-1111-111111111111
      stderr: This permanently deletes

  - name: delete without confirmation sends nothing
    op: delete
    args: [--feedback-id, 11111111-1111-1111-1111-111111111111]
    stdin: "n\n"
    want:
      requests: 0
      error: not confirmed

  - name: delete with --yes skips the prompt
    op: delete
    args: [--feedback-id, 11111111-1111-1111-1111-111111111111, --yes]
    response:
      body: {}
    want:
      method: DELETE
      path: /api/v1/feedback/11111111-1111-1111-1111-111111111111

lifecycle_skip: "Feedback is written on an existing run or tracing project, which the feedback commands cannot create; runs are ingested through the SDKs."
