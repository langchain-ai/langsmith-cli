# Tests for the generated `langsmith examples` commands. Contract cases run
# against a fake API. list, create, and delete are hand-written commands.
resource: examples

contract:
  - name: retrieve
    op: retrieve
    args: [--example-id, 11111111-1111-1111-1111-111111111111]
    response:
      body: &example
        id: 11111111-1111-1111-1111-111111111111
        dataset_id: 22222222-2222-2222-2222-222222222222
        inputs: {question: What is LangSmith}
        outputs: {answer: A platform}
        metadata: {source: docs}
        created_at: "2026-10-01T00:00:00Z"
        modified_at: "2026-10-01T00:00:00Z"
    want:
      method: GET
      path: /api/v1/examples/11111111-1111-1111-1111-111111111111
      stdout: What is LangSmith

  - name: retrieve at a dataset version
    op: retrieve
    args:
      - --example-id
      - 11111111-1111-1111-1111-111111111111
      - --dataset
      - 22222222-2222-2222-2222-222222222222
      - --as-of
      - "2026-10-01T00:00:00Z"
    response:
      body: *example
    want:
      method: GET
      path: /api/v1/examples/11111111-1111-1111-1111-111111111111
      query: {dataset: 22222222-2222-2222-2222-222222222222, as_of: "2026-10-01T00:00:00Z"}
      stdout: 11111111-1111-1111-1111-111111111111

  - name: retrieve reports API errors
    op: retrieve
    args: [--example-id, 11111111-1111-1111-1111-111111111111]
    response:
      status: 404
      body: {detail: Examples not found}
    want:
      method: GET
      path: /api/v1/examples/11111111-1111-1111-1111-111111111111
      exit_code: 1
      stderr: 404 Not Found

  - name: update with every field
    op: update
    args:
      - --example-id
      - 11111111-1111-1111-1111-111111111111
      - --dataset-id
      - 22222222-2222-2222-2222-222222222222
      # Map and nullable list flags take a YAML literal.
      - --inputs
      - "{question: What is LangSmith}"
      - --outputs
      - "{answer: A platform}"
      - --metadata
      - "{source: docs, rank: -1}"
      - --split
      - "[train, test]"
      - --attachments-operations
      - "{rename: {old.png: new.png}, retain: [keep.txt]}"
      - --overwrite
    response:
      body: {message: Example updated}
    want:
      method: PATCH
      path: /api/v1/examples/11111111-1111-1111-1111-111111111111
      body:
        dataset_id: 22222222-2222-2222-2222-222222222222
        inputs: {question: What is LangSmith}
        outputs: {answer: A platform}
        metadata: {source: docs, rank: -1}
        split: [train, test]
        attachments_operations: {rename: {old.png: new.png}, retain: [keep.txt]}
        overwrite: true
      stdout: Example updated

  # Runs after the case above, so it also shows flag values do not carry over.
  - name: update sends only the flags given
    op: update
    args: [--example-id, 11111111-1111-1111-1111-111111111111, --split, test]
    response:
      body: {message: Example updated}
    want:
      method: PATCH
      path: /api/v1/examples/11111111-1111-1111-1111-111111111111
      body: {split: test}
      stdout: Example updated

  - name: retrieve-count in a dataset
    op: retrieve-count
    args:
      - --dataset
      - 22222222-2222-2222-2222-222222222222
      - --id
      - "[11111111-1111-1111-1111-111111111111]"
      - --split
      - "[test]"
      - --full-text-contain
      - "[LangSmith]"
      - --metadata
      - '{"source": "docs"}'
      - --filter
      - has(metadata, '{"source":"docs"}')
      - --as-of
      - "2026-10-01T00:00:00Z"
    response:
      body: 1
    want:
      method: GET
      path: /api/v1/examples/count
      query:
        dataset: 22222222-2222-2222-2222-222222222222
        id: 11111111-1111-1111-1111-111111111111
        splits: test
        full_text_contains: LangSmith
        metadata: '{"source": "docs"}'
        filter: has(metadata, '{"source":"docs"}')
        as_of: "2026-10-01T00:00:00Z"
      stdout: "1"

  - name: retrieve-count in a workspace
    op: retrieve-count
    args: [--workspace, 44444444-4444-4444-4444-444444444444]
    response:
      body: 3
    want:
      method: GET
      path: /api/v1/examples/count
      headers: {X-Tenant-Id: 44444444-4444-4444-4444-444444444444}
      stdout: "3"

  - name: delete-all after confirmation
    op: delete-all
    args: [--example-id, 11111111-1111-1111-1111-111111111111]
    stdin: "y\n"
    response:
      body: null
    want:
      method: DELETE
      path: /api/v1/examples
      query: {example_ids: 11111111-1111-1111-1111-111111111111}
      stderr: This permanently deletes

  - name: delete-all without confirmation sends nothing
    op: delete-all
    args: [--example-id, 11111111-1111-1111-1111-111111111111, --example-id, 33333333-3333-3333-3333-333333333333]
    stdin: "n\n"
    want:
      requests: 0
      error: not confirmed

  - name: delete-all with --yes skips the prompt
    op: delete-all
    args: [--example-id, 11111111-1111-1111-1111-111111111111, --yes]
    response:
      body: null
    want:
      method: DELETE
      path: /api/v1/examples
      query: {example_ids: 11111111-1111-1111-1111-111111111111}

lifecycle_skip: "Needs a dataset, which these generated commands cannot create."
