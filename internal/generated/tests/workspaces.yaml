# Tests for the generated `langsmith workspaces` commands; list is hand-written.
# Contract cases run against a fake API.
resource: workspaces

contract:
  - name: create with every field
    op: create
    args:
      - --display-name
      - Team (prod)
      - --id
      - 11111111-1111-1111-1111-111111111111
      - --tenant-handle
      - team-prod
    response:
      body: &workspace
        id: 11111111-1111-1111-1111-111111111111
        organization_id: 22222222-2222-2222-2222-222222222222
        display_name: Team (prod)
        tenant_handle: team-prod
        is_personal: false
        is_deleted: false
        created_at: "2026-09-30T00:00:00Z"
    want:
      method: POST
      path: /api/v1/workspaces
      body:
        display_name: Team (prod)
        id: 11111111-1111-1111-1111-111111111111
        tenant_handle: team-prod
      stdout: '"id": "11111111-1111-1111-1111-111111111111"'

  # Runs after the case above, so it also shows flag values do not carry over
  # between invocations.
  - name: create sends only the flags given
    op: create
    args: [--display-name, Team]
    response:
      body: *workspace
    want:
      method: POST
      path: /api/v1/workspaces
      body: {display_name: Team}
      stdout: 11111111-1111-1111-1111-111111111111

  - name: create reports API errors
    op: create
    args: [--display-name, Team]
    response:
      status: 403
      body: {detail: Forbidden}
    want:
      method: POST
      path: /api/v1/workspaces
      body: {display_name: Team}
      exit_code: 1
      stderr: 403 Forbidden

  - name: --yes is rejected outside delete
    op: create
    args: [--display-name, Team, --yes]
    want:
      requests: 0
      exit_code: 1
      stderr: "yes"

  - name: retrieve a deleted workspace
    op: retrieve
    args: [--id, 11111111-1111-1111-1111-111111111111, --include-deleted]
    response:
      body: *workspace
    want:
      method: GET
      path: /api/v1/workspaces/11111111-1111-1111-1111-111111111111
      query: {include_deleted: "true"}
      stdout: '"display_name": "Team (prod)"'

  - name: retrieve reports API errors
    op: retrieve
    args: [--id, 55555555-5555-5555-5555-555555555555]
    response:
      status: 404
      body: {detail: Workspace not found}
    want:
      method: GET
      path: /api/v1/workspaces/55555555-5555-5555-5555-555555555555
      exit_code: 1
      stderr: 404 Not Found

  - name: update renames the workspace
    op: update
    args: [--id, 11111111-1111-1111-1111-111111111111, --display-name, Team (staging)]
    response:
      body: {message: Workspace updated}
    want:
      method: PATCH
      path: /api/v1/workspaces/11111111-1111-1111-1111-111111111111
      body: {display_name: Team (staging)}
      stdout: Workspace updated

  # The API deletes only the workspace the request is scoped to, so --workspace
  # names the same workspace as --id.
  - name: delete after confirmation
    op: delete
    args: [--id, 11111111-1111-1111-1111-111111111111, --workspace, 11111111-1111-1111-1111-111111111111]
    stdin: "y\n"
    response:
      body: {message: Workspace deleted}
    want:
      method: DELETE
      path: /api/v1/workspaces/11111111-1111-1111-1111-111111111111
      headers: {X-Tenant-Id: 11111111-1111-1111-1111-111111111111}
      stdout: Workspace deleted
      stderr: This permanently deletes

  - name: delete without confirmation sends nothing
    op: delete
    args: [--id, 11111111-1111-1111-1111-111111111111]
    stdin: "n\n"
    want:
      requests: 0
      error: not confirmed

  - name: delete of another workspace with --yes reports API errors
    op: delete
    args: [--id, 11111111-1111-1111-1111-111111111111, --yes]
    response:
      status: 403
      body: {detail: Cannot delete workspace with current credentials.}
    want:
      method: DELETE
      path: /api/v1/workspaces/11111111-1111-1111-1111-111111111111
      exit_code: 1
      stderr: 403 Forbidden

lifecycle_skip: "Creating and deleting a workspace needs organization admin rights, which the shared test key does not have."
