# Tests for `langsmith settings`. Contract cases run against a fake API.
resource: settings

contract:
  - name: list returns the workspace settings
    op: list
    response:
      body: &settings
        id: 44444444-4444-4444-4444-444444444444
        display_name: My workspace
        created_at: "2026-10-01T00:00:00Z"
        tenant_handle: my-handle
    want:
      method: GET
      path: /api/v1/settings
      stdout: '"tenant_handle": "my-handle"'

  - name: list in a workspace
    op: list
    args: [--workspace, 44444444-4444-4444-4444-444444444444]
    response:
      body: *settings
    want:
      method: GET
      path: /api/v1/settings
      headers: {X-Tenant-Id: 44444444-4444-4444-4444-444444444444}
      stdout: My workspace

  - name: list reports API errors
    op: list
    response:
      status: 403
      body: {detail: Forbidden}
    want:
      method: GET
      path: /api/v1/settings
      exit_code: 1
      stderr: 403 Forbidden

lifecycle_skip: "Read-only: returns the current workspace's settings, which the CLI cannot create or delete."
