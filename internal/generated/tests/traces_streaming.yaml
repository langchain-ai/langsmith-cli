# Tests for `langsmith traces:streaming`. Contract cases run against a fake API
# that answers with server-sent events: each data event is a JSON list of
# RFC 6902 patch operations on {items, next_cursor}, and an end event closes
# the stream. The command prints each event as it arrives.
resource: traces:streaming

contract:
  - name: query with every field
    op: query
    args:
      - --project-id
      - 11111111-1111-1111-1111-111111111111
      - --ai-search
      - the agent refused the request
      - --select
      - ID
      - --select
      - NAME
      - --trace-id
      - 22222222-2222-2222-2222-222222222222
      - --trace-id
      - 33333333-3333-3333-3333-333333333333
      - --trace-filter
      - eq(status, "error")
      - --tree-filter
      - eq(name, "retriever")
      - --min-start-time
      - "2026-10-01T00:00:00Z"
      - --max-start-time
      - "2026-10-02T00:00:00Z"
      - --min-feedback-modified-at
      - "2026-10-01T06:00:00Z"
      - --max-feedback-modified-at
      - "2026-10-01T18:00:00Z"
      - --page-size
      - "50"
      - --cursor
      - abc123
    response:
      headers: {Content-Type: text/event-stream}
      body: &events "event: data\ndata: [{\"op\":\"add\",\"path\":\"\",\"value\":{\"items\":[],\"next_cursor\":null}}]\n\nevent: data\ndata: [{\"op\":\"add\",\"path\":\"/items/-\",\"value\":{\"root_run\":{\"id\":\"22222222-2222-2222-2222-222222222222\",\"name\":\"agent\"}}}]\n\nevent: data\ndata: [{\"op\":\"replace\",\"path\":\"/next_cursor\",\"value\":\"def456\"}]\n\nevent: end\ndata: \n\n"
    want:
      method: POST
      path: /api/v2/traces/query
      headers: {Accept: text/event-stream}
      body:
        project_id: 11111111-1111-1111-1111-111111111111
        ai_search: the agent refused the request
        selects: [ID, NAME]
        trace_ids: [22222222-2222-2222-2222-222222222222, 33333333-3333-3333-3333-333333333333]
        trace_filter: eq(status, "error")
        tree_filter: eq(name, "retriever")
        min_start_time: "2026-10-01T00:00:00Z"
        max_start_time: "2026-10-02T00:00:00Z"
        min_feedback_modified_at: "2026-10-01T06:00:00Z"
        max_feedback_modified_at: "2026-10-01T18:00:00Z"
        page_size: 50
        cursor: abc123
      stdout: '"path": "/items/-"'

  # Runs after the case above, so it also shows flag values do not carry over.
  - name: query sends only the flags given
    op: query
    args: [--project-id, 11111111-1111-1111-1111-111111111111]
    response:
      headers: {Content-Type: text/event-stream}
      body: *events
    want:
      method: POST
      path: /api/v2/traces/query
      headers: {Accept: text/event-stream}
      body: {project_id: 11111111-1111-1111-1111-111111111111}
      stdout: '"value": "def456"'

  - name: query in a workspace
    op: query
    args: [--project-id, 11111111-1111-1111-1111-111111111111, --workspace, 44444444-4444-4444-4444-444444444444]
    response:
      headers: {Content-Type: text/event-stream}
      body: *events
    want:
      method: POST
      path: /api/v2/traces/query
      headers: {Accept: text/event-stream, X-Tenant-Id: 44444444-4444-4444-4444-444444444444}
      body: {project_id: 11111111-1111-1111-1111-111111111111}

  - name: query reports error events
    op: query
    args: [--project-id, 11111111-1111-1111-1111-111111111111, --trace-filter, eq(]
    response:
      headers: {Content-Type: text/event-stream}
      body: "event: data\ndata: [{\"op\":\"add\",\"path\":\"\",\"value\":{\"items\":[],\"next_cursor\":null}}]\n\nevent: error\ndata: {\"type\":\"about:blank\",\"title\":\"Bad Request\",\"status\":400,\"detail\":\"invalid trace_filter\",\"instance\":\"/api/v2/traces/query\"}\n\n"
    want:
      method: POST
      path: /api/v2/traces/query
      body: {project_id: 11111111-1111-1111-1111-111111111111, trace_filter: eq(}
      exit_code: 1
      stderr: invalid trace_filter

  - name: query reports API errors
    op: query
    args: [--project-id, 11111111-1111-1111-1111-111111111111, --page-size, "5000"]
    response:
      status: 400
      headers: {Content-Type: application/problem+json}
      body: {type: about:blank, title: Bad Request, status: 400, detail: page_size must be between 1 and 1000}
    want:
      method: POST
      path: /api/v2/traces/query
      body: {project_id: 11111111-1111-1111-1111-111111111111, page_size: 5000}
      exit_code: 1
      stderr: 400 Bad Request

lifecycle_skip: "Read-only queries over traces, which the CLI cannot create; traces are ingested through the SDKs."
