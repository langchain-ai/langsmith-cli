# Tests for `langsmith datasets share`. Contract cases run against a fake API.
resource: datasets:share

contract:
  - name: create with every flag
    op: create
    args: [--dataset-id, 11111111-1111-1111-1111-111111111111, --share-projects]
    response:
      body: &token
        dataset_id: 11111111-1111-1111-1111-111111111111
        share_token: 22222222-2222-2222-2222-222222222222
    want:
      method: PUT
      path: /api/v1/datasets/11111111-1111-1111-1111-111111111111/share
      query: {share_projects: "true"}
      stdout: 22222222-2222-2222-2222-222222222222

  - name: create with only the dataset
    op: create
    args:
      - --dataset-id
      - 11111111-1111-1111-1111-111111111111
      - --workspace
      - 33333333-3333-3333-3333-333333333333
    response:
      body: *token
    want:
      method: PUT
      path: /api/v1/datasets/11111111-1111-1111-1111-111111111111/share
      headers: {X-Tenant-Id: 33333333-3333-3333-3333-333333333333}
      stdout: 22222222-2222-2222-2222-222222222222

  - name: create reports API errors
    op: create
    args: [--dataset-id, 11111111-1111-1111-1111-111111111111]
    response:
      status: 403
      body: {detail: Public sharing is disabled for this organization}
    want:
      method: PUT
      path: /api/v1/datasets/11111111-1111-1111-1111-111111111111/share
      exit_code: 1
      stderr: 403 Forbidden

  - name: retrieve
    op: retrieve
    args: [--dataset-id, 11111111-1111-1111-1111-111111111111]
    response:
      body: *token
    want:
      method: GET
      path: /api/v1/datasets/11111111-1111-1111-1111-111111111111/share
      stdout: 22222222-2222-2222-2222-222222222222

  - name: retrieve a dataset that is not shared
    op: retrieve
    args: [--dataset-id, 11111111-1111-1111-1111-111111111111]
    response:
      body: "null"
    want:
      method: GET
      path: /api/v1/datasets/11111111-1111-1111-1111-111111111111/share
      stdout: "null"

  - name: delete-all after confirmation
    op: delete-all
    args: [--dataset-id, 11111111-1111-1111-1111-111111111111]
    stdin: "y\n"
    response:
      body: {message: Dataset unshared}
    want:
      method: DELETE
      path: /api/v1/datasets/11111111-1111-1111-1111-111111111111/share
      stderr: This permanently deletes

  - name: delete-all without confirmation sends nothing
    op: delete-all
    args: [--dataset-id, 11111111-1111-1111-1111-111111111111]
    stdin: "n\n"
    want:
      requests: 0
      error: not confirmed

  - name: delete-all with --yes skips the prompt
    op: delete-all
    args: [--dataset-id, 11111111-1111-1111-1111-111111111111, --yes]
    response:
      body: {message: Dataset unshared}
    want:
      method: DELETE
      path: /api/v1/datasets/11111111-1111-1111-1111-111111111111/share

  - name: delete-all reports API errors
    op: delete-all
    args: [--dataset-id, 11111111-1111-1111-1111-111111111111, --yes]
    response:
      status: 404
      body: {detail: Dataset not found}
    want:
      method: DELETE
      path: /api/v1/datasets/11111111-1111-1111-1111-111111111111/share
      exit_code: 1
      stderr: 404 Not Found

lifecycle_skip: "Sharing makes a dataset public, and these commands cannot create a throwaway dataset to share; datasets are created with the hand-written datasets commands."
