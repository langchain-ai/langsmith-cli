# Tests for `langsmith datasets versions`. Contract cases run against a fake API.
resource: datasets:versions

contract:
  - name: retrieve-diff between two times
    op: retrieve-diff
    args:
      - --dataset-id
      - 11111111-1111-1111-1111-111111111111
      - --from-version
      - "2026-10-01T00:00:00Z"
      - --to-version
      - "2026-10-02T00:00:00Z"
    response:
      body: &diff
        examples_added: [22222222-2222-2222-2222-222222222222]
        examples_modified: []
        examples_removed: []
    want:
      method: GET
      path: /api/v1/datasets/11111111-1111-1111-1111-111111111111/versions/diff
      query: {from_version: "2026-10-01T00:00:00Z", to_version: "2026-10-02T00:00:00Z"}
      stdout: 22222222-2222-2222-2222-222222222222

  - name: retrieve-diff between tags in a workspace
    op: retrieve-diff
    args:
      - --dataset-id
      - 11111111-1111-1111-1111-111111111111
      - --from-version
      - staging
      - --to-version
      - prod
      - --workspace
      - 44444444-4444-4444-4444-444444444444
    response:
      body: *diff
    want:
      method: GET
      path: /api/v1/datasets/11111111-1111-1111-1111-111111111111/versions/diff
      headers: {X-Tenant-Id: 44444444-4444-4444-4444-444444444444}
      query: {from_version: staging, to_version: prod}

  - name: retrieve-diff reports API errors
    op: retrieve-diff
    args: [--dataset-id, 11111111-1111-1111-1111-111111111111, --from-version, missing, --to-version, prod]
    response:
      status: 404
      body: {detail: from_version not found}
    want:
      method: GET
      path: /api/v1/datasets/11111111-1111-1111-1111-111111111111/versions/diff
      exit_code: 1
      stderr: 404 Not Found

  - name: retrieve-diff requires both versions
    op: retrieve-diff
    args: [--dataset-id, 11111111-1111-1111-1111-111111111111, --from-version, staging]
    want:
      requests: 0
      exit_code: 1
      stderr: Required flag "to-version" not set

lifecycle_skip: "Compares versions of an existing dataset, which these generated commands cannot create."
