# Tests for `langsmith threads:streaming`. Contract cases run against a fake
# API that answers with server-sent events: each data event is a JSON list of
# RFC 6902 patch operations on {items, next_cursor}, and an end event closes
# the stream. The command prints each event as it arrives.
resource: threads:streaming

contract:
  - name: query with every field
    op: query
    args:
      - --project-id
      - 11111111-1111-1111-1111-111111111111
      - --ai-search
      - the user asked for a refund
      - --filter
      - eq(status, "error")
      - --thread-filter
      - gt(turns, 2)
      - --trace-filter
      - has(tags, "production")
      - --tree-filter
      - eq(name, "retriever")
      - --min-start-time
      - "2026-10-01T00:00:00Z"
      - --max-start-time
      - "2026-10-02T00:00:00Z"
      - --page-size
      - "50"
      - --cursor
      - abc123
    response:
      headers: {Content-Type: text/event-stream}
      body: &events "event: data\ndata: [{\"op\":\"add\",\"path\":\"\",\"value\":{\"items\":[],\"next_cursor\":null}}]\n\nevent: data\ndata: [{\"op\":\"add\",\"path\":\"/items/-\",\"value\":{\"thread_id\":\"thread-1\",\"count\":3}}]\n\nevent: data\ndata: [{\"op\":\"replace\",\"path\":\"/next_cursor\",\"value\":\"def456\"}]\n\nevent: end\ndata: \n\n"
    want:
      method: POST
      path: /api/v2/threads/query
      headers: {Accept: text/event-stream}
      body:
        project_id: 11111111-1111-1111-1111-111111111111
        ai_search: the user asked for a refund
        filter: eq(status, "error")
        thread_filter: gt(turns, 2)
        trace_filter: has(tags, "production")
        tree_filter: eq(name, "retriever")
        min_start_time: "2026-10-01T00:00:00Z"
        max_start_time: "2026-10-02T00:00:00Z"
        page_size: 50
        cursor: abc123
      stdout: '"thread_id": "thread-1"'

  # Runs after the case above, so it also shows flag values do not carry over.
  - name: query sends only the flags given
    op: query
    args: [--project-id, 11111111-1111-1111-1111-111111111111]
    response:
      headers: {Content-Type: text/event-stream}
      body: *events
    want:
      method: POST
      path: /api/v2/threads/query
      headers: {Accept: text/event-stream}
      body: {project_id: 11111111-1111-1111-1111-111111111111}
      stdout: '"value": "def456"'

  - name: query in a workspace
    op: query
    args: [--project-id, 11111111-1111-1111-1111-111111111111, --workspace, 44444444-4444-4444-4444-444444444444]
    response:
      headers: {Content-Type: text/event-stream}
      body: *events
    want:
      method: POST
      path: /api/v2/threads/query
      headers: {Accept: text/event-stream, X-Tenant-Id: 44444444-4444-4444-4444-444444444444}
      body: {project_id: 11111111-1111-1111-1111-111111111111}

  - name: query reports error events
    op: query
    args: [--project-id, 11111111-1111-1111-1111-111111111111, --ai-search, the user asked for a refund]
    response:
      headers: {Content-Type: text/event-stream}
      body: "event: data\ndata: [{\"op\":\"add\",\"path\":\"\",\"value\":{\"items\":[],\"next_cursor\":null}}]\n\nevent: error\ndata: {\"type\":\"about:blank\",\"title\":\"Service Unavailable\",\"status\":503,\"detail\":\"AI search is unavailable\",\"instance\":\"/api/v2/threads/query\"}\n\n"
    want:
      method: POST
      path: /api/v2/threads/query
      body: {project_id: 11111111-1111-1111-1111-111111111111, ai_search: the user asked for a refund}
      exit_code: 1
      stderr: AI search is unavailable

  - name: query reports API errors
    op: query
    args: [--project-id, 11111111-1111-1111-1111-111111111111, --page-size, "5000"]
    response:
      status: 400
      headers: {Content-Type: application/problem+json}
      body: {type: about:blank, title: Bad Request, status: 400, detail: page_size must be between 1 and 1000}
    want:
      method: POST
      path: /api/v2/threads/query
      body: {project_id: 11111111-1111-1111-1111-111111111111, page_size: 5000}
      exit_code: 1
      stderr: 400 Bad Request

lifecycle_skip: "Read-only queries over existing threads, which the CLI cannot create; traces are ingested through the SDKs."
