# Tests for `langsmith threads share`. Contract cases run against a fake API.
resource: threads:share

contract:
  - name: create
    op: create
    args: [--thread-id, thread-1, --project-id, 11111111-1111-1111-1111-111111111111]
    response:
      body: &token {share_token: 22222222-2222-2222-2222-222222222222}
    want:
      method: POST
      path: /api/v2/threads/thread-1/share
      body: {project_id: 11111111-1111-1111-1111-111111111111}
      stdout: 22222222-2222-2222-2222-222222222222

  - name: retrieve
    op: retrieve
    args: [--thread-id, thread-1, --project-id, 11111111-1111-1111-1111-111111111111]
    response:
      body: *token
    want:
      method: GET
      path: /api/v2/threads/thread-1/share
      query: {project_id: 11111111-1111-1111-1111-111111111111}
      stdout: 22222222-2222-2222-2222-222222222222

  - name: retrieve reports API errors
    op: retrieve
    args: [--thread-id, thread-1, --project-id, 11111111-1111-1111-1111-111111111111]
    response:
      status: 404
      body: {detail: Thread not found}
    want:
      method: GET
      path: /api/v2/threads/thread-1/share
      exit_code: 1
      stderr: 404 Not Found

  - name: delete after confirmation
    op: delete
    args: [--thread-id, thread-1, --project-id, 11111111-1111-1111-1111-111111111111]
    stdin: "y\n"
    response:
      status: 204
    want:
      method: DELETE
      path: /api/v2/threads/thread-1/share
      query: {project_id: 11111111-1111-1111-1111-111111111111}
      stderr: This permanently deletes

  - name: delete without confirmation sends nothing
    op: delete
    args: [--thread-id, thread-1, --project-id, 11111111-1111-1111-1111-111111111111]
    stdin: "n\n"
    want:
      requests: 0
      error: not confirmed

  - name: delete with --yes skips the prompt
    op: delete
    args: [--thread-id, thread-1, --project-id, 11111111-1111-1111-1111-111111111111, --yes]
    response:
      status: 204
    want:
      method: DELETE
      path: /api/v2/threads/thread-1/share
      query: {project_id: 11111111-1111-1111-1111-111111111111}

lifecycle_skip: "Sharing makes an existing thread public, and the CLI cannot create a thread to share; traces are ingested through the SDKs."
