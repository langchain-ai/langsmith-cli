# Tests for `langsmith datasets`. Contract cases run against a fake API.
resource: datasets

contract:
  - name: retrieve-version by time
    op: retrieve-version
    args: [--dataset-id, 11111111-1111-1111-1111-111111111111, --as-of, "2026-10-01T00:00:00Z"]
    response:
      body: &version {as_of: "2026-10-01T00:00:00Z", tags: [prod]}
    want:
      method: GET
      path: /api/v1/datasets/11111111-1111-1111-1111-111111111111/version
      query: {as_of: "2026-10-01T00:00:00Z"}
      stdout: prod

  # Runs after the case above, so it also shows flag values do not carry over.
  - name: retrieve-version by tag
    op: retrieve-version
    args: [--dataset-id, 11111111-1111-1111-1111-111111111111, --tag, prod, --workspace, 44444444-4444-4444-4444-444444444444]
    response:
      body: *version
    want:
      method: GET
      path: /api/v1/datasets/11111111-1111-1111-1111-111111111111/version
      headers: {X-Tenant-Id: 44444444-4444-4444-4444-444444444444}
      query: {tag: prod}

  - name: retrieve-version reports API errors
    op: retrieve-version
    args: [--dataset-id, 11111111-1111-1111-1111-111111111111]
    response:
      status: 400
      body: {detail: Exactly one of as_of and tag must be specified.}
    want:
      method: GET
      path: /api/v1/datasets/11111111-1111-1111-1111-111111111111/version
      exit_code: 1
      stderr: 400 Bad Request

  - name: --yes is rejected outside delete
    op: retrieve-version
    args: [--dataset-id, 11111111-1111-1111-1111-111111111111, --tag, prod, --yes]
    want:
      requests: 0
      exit_code: 1
      stderr: "yes"

  - name: update with every field
    op: update
    args:
      - --dataset-id
      - 11111111-1111-1111-1111-111111111111
      - --name
      - support questions
      - --description
      - questions from the support queue
      - --inputs-schema-definition
      - "{type: object, properties: {messages: {type: array}}}"
      - --outputs-schema-definition
      - "{type: object, properties: {answer: {type: string}}}"
      # Nullable list and map flags take a YAML literal.
      - --transformations
      - "[{path: [inputs, messages], transformation_type: convert_to_openai_message}]"
      - --metadata
      - "{team: support, version: 2}"
      - --baseline-experiment-id
      - 22222222-2222-2222-2222-222222222222
      - --patch-examples
      - "{33333333-3333-3333-3333-333333333333: {outputs: {answer: fixed}}}"
    response:
      body: &dataset
        id: 11111111-1111-1111-1111-111111111111
        name: support questions
        tenant_id: 55555555-5555-5555-5555-555555555555
        created_at: "2026-10-01T00:00:00Z"
        modified_at: "2026-10-02T00:00:00Z"
    want:
      method: PATCH
      path: /api/v1/datasets/11111111-1111-1111-1111-111111111111
      body:
        name: support questions
        description: questions from the support queue
        inputs_schema_definition: {type: object, properties: {messages: {type: array}}}
        outputs_schema_definition: {type: object, properties: {answer: {type: string}}}
        transformations: [{path: [inputs, messages], transformation_type: convert_to_openai_message}]
        metadata: {team: support, version: 2}
        baseline_experiment_id: 22222222-2222-2222-2222-222222222222
        patch_examples: {33333333-3333-3333-3333-333333333333: {outputs: {answer: fixed}}}
      stdout: support questions

  # Runs after the case above, so it also shows flag values do not carry over.
  - name: update sends only the flags given
    op: update
    args:
      - --dataset-id
      - 11111111-1111-1111-1111-111111111111
      - --name
      - support questions v2
      - --workspace
      - 44444444-4444-4444-4444-444444444444
    response:
      body: *dataset
    want:
      method: PATCH
      path: /api/v1/datasets/11111111-1111-1111-1111-111111111111
      headers: {X-Tenant-Id: 44444444-4444-4444-4444-444444444444}
      body: {name: support questions v2}

  - name: update reports API errors
    op: update
    args: [--dataset-id, 11111111-1111-1111-1111-111111111111, --name, renamed]
    response:
      status: 404
      body: {detail: Dataset not found}
    want:
      method: PATCH
      path: /api/v1/datasets/11111111-1111-1111-1111-111111111111
      body: {name: renamed}
      exit_code: 1
      stderr: 404 Not Found

  - name: clone with every field
    op: clone
    args:
      - --target-dataset-id
      - 22222222-2222-2222-2222-222222222222
      - --source-dataset-id
      - 11111111-1111-1111-1111-111111111111
      - --as-of
      - prod
      - --example
      - 55555555-5555-5555-5555-555555555555
      - --example
      - 66666666-6666-6666-6666-666666666666
      # Nullable list flags take a YAML literal; a repeated --tag-value-id
      # keeps only the last value.
      - --split
      - "[train, test]"
      - --tag-value-id
      - "[77777777-7777-7777-7777-777777777777]"
    response:
      body: &cloned
        - id: 88888888-8888-8888-8888-888888888888
          dataset_id: 22222222-2222-2222-2222-222222222222
          created_at: "2026-10-01T00:00:00Z"
          modified_at: "2026-10-01T00:00:00Z"
          source_run_id: null
    want:
      method: POST
      path: /api/v1/datasets/clone
      body:
        target_dataset_id: 22222222-2222-2222-2222-222222222222
        source_dataset_id: 11111111-1111-1111-1111-111111111111
        as_of: prod
        examples: [55555555-5555-5555-5555-555555555555, 66666666-6666-6666-6666-666666666666]
        split: [train, test]
        tag_value_ids: [77777777-7777-7777-7777-777777777777]
      stdout: 88888888-8888-8888-8888-888888888888

  # Runs after the case above, so it also shows flag values do not carry over.
  - name: clone with only the datasets
    op: clone
    args:
      - --target-dataset-id
      - 22222222-2222-2222-2222-222222222222
      - --source-dataset-id
      - 11111111-1111-1111-1111-111111111111
      - --workspace
      - 44444444-4444-4444-4444-444444444444
    response:
      body: *cloned
    want:
      method: POST
      path: /api/v1/datasets/clone
      headers: {X-Tenant-Id: 44444444-4444-4444-4444-444444444444}
      body:
        target_dataset_id: 22222222-2222-2222-2222-222222222222
        source_dataset_id: 11111111-1111-1111-1111-111111111111

  - name: clone at a point in time into one split
    op: clone
    args:
      - --target-dataset-id
      - 22222222-2222-2222-2222-222222222222
      - --source-dataset-id
      - 11111111-1111-1111-1111-111111111111
      - --as-of
      - "2026-10-01T00:00:00Z"
      - --split
      - train
    response:
      body: *cloned
    want:
      method: POST
      path: /api/v1/datasets/clone
      body:
        target_dataset_id: 22222222-2222-2222-2222-222222222222
        source_dataset_id: 11111111-1111-1111-1111-111111111111
        as_of: "2026-10-01T00:00:00Z"
        split: train

  - name: clone reports API errors
    op: clone
    args:
      - --target-dataset-id
      - 22222222-2222-2222-2222-222222222222
      - --source-dataset-id
      - 11111111-1111-1111-1111-111111111111
      - --example
      - 55555555-5555-5555-5555-555555555555
    response:
      status: 404
      body: {detail: Source dataset 11111111-1111-1111-1111-111111111111 not found}
    want:
      method: POST
      path: /api/v1/datasets/clone
      body:
        target_dataset_id: 22222222-2222-2222-2222-222222222222
        source_dataset_id: 11111111-1111-1111-1111-111111111111
        examples: [55555555-5555-5555-5555-555555555555]
      exit_code: 1
      stderr: 404 Not Found

  - name: update-tags at a time
    op: update-tags
    args: [--dataset-id, 11111111-1111-1111-1111-111111111111, --as-of, "2026-10-01T00:00:00Z", --tag, prod]
    response:
      body: {as_of: "2026-10-01T00:00:00Z", tags: [prod]}
    want:
      method: PUT
      path: /api/v1/datasets/11111111-1111-1111-1111-111111111111/tags
      body: {as_of: "2026-10-01T00:00:00Z", tag: prod}
      stdout: "2026-10-01T00:00:00Z"

  # Runs after the case above, so it also shows flag values do not carry over.
  - name: update-tags from another tag in a workspace
    op: update-tags
    args: [--dataset-id, 11111111-1111-1111-1111-111111111111, --as-of, staging, --tag, prod, --workspace, 44444444-4444-4444-4444-444444444444]
    response:
      body: {as_of: "2026-10-02T00:00:00Z", tags: [prod]}
    want:
      method: PUT
      path: /api/v1/datasets/11111111-1111-1111-1111-111111111111/tags
      headers: {X-Tenant-Id: 44444444-4444-4444-4444-444444444444}
      body: {as_of: staging, tag: prod}

  - name: update-tags reports API errors
    op: update-tags
    args: [--dataset-id, 11111111-1111-1111-1111-111111111111, --as-of, "2026-10-01T00:00:00Z", --tag, latest]
    response:
      status: 400
      body: {detail: The tag 'latest' is reserved and cannot be used as a tag.}
    want:
      method: PUT
      path: /api/v1/datasets/11111111-1111-1111-1111-111111111111/tags
      body: {as_of: "2026-10-01T00:00:00Z", tag: latest}
      exit_code: 1
      stderr: 400 Bad Request

lifecycle_skip: "Reads, updates, tags and copies versions of existing datasets, which these generated commands cannot create."
