# Tests for `langsmith sandboxes snapshots`. Contract cases run against a fake API.
resource: sandboxes:snapshots

contract:
  - name: retrieve-by-name lists the tags under a name
    op: retrieve-by-name
    args: [--name, python-base]
    response:
      body:
        name: python-base
        tags:
          - {tag: latest, snapshot_id: 11111111-1111-1111-1111-111111111111}
          - {tag: v2, snapshot_id: 22222222-2222-2222-2222-222222222222}
    want:
      method: GET
      path: /api/v2/sandboxes/snapshots-by-name/python-base
      stdout: 22222222-2222-2222-2222-222222222222

  - name: retrieve-by-name in a workspace
    op: retrieve-by-name
    args: [--name, python-base, --workspace, 44444444-4444-4444-4444-444444444444]
    response:
      body: {name: python-base, tags: []}
    want:
      method: GET
      path: /api/v2/sandboxes/snapshots-by-name/python-base
      headers: {X-Tenant-Id: 44444444-4444-4444-4444-444444444444}

  - name: retrieve-by-name reports API errors
    op: retrieve-by-name
    args: [--name, missing]
    response:
      status: 404
      body: {detail: snapshot name not found}
    want:
      method: GET
      path: /api/v2/sandboxes/snapshots-by-name/missing
      exit_code: 1
      stderr: 404 Not Found

lifecycle_skip: "Reads an existing snapshot name; snapshots are built with the hand-written sandboxes snapshot commands."
