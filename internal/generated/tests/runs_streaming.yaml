# Tests for `langsmith runs:streaming`. Contract cases run against a fake API
# that answers with server-sent events: each data event is a JSON list of
# RFC 6902 patch operations on {items, next_cursor}, and an end event closes
# the stream. The command prints each event as it arrives.
resource: runs:streaming

contract:
  - name: query-v2 with every field
    op: query-v2
    args:
      - --project-id
      - 11111111-1111-1111-1111-111111111111
      - --project-id
      - 22222222-2222-2222-2222-222222222222
      - --ai-search
      - the tool call failed
      - --filter
      - eq(status, "error")
      - --trace-filter
      - has(tags, "production")
      - --tree-filter
      - eq(name, "retriever")
      - --trace-id
      - 33333333-3333-3333-3333-333333333333
      - --id
      - 55555555-5555-5555-5555-555555555555
      - --reference-example
      - 66666666-6666-6666-6666-666666666666
      - --run-type
      - LLM
      - --is-root
      - --has-error
      - --select
      - ID
      - --select
      - NAME
      - --min-start-time
      - "2026-10-01T00:00:00Z"
      - --max-start-time
      - "2026-10-02T00:00:00Z"
      - --min-feedback-modified-at
      - "2026-10-01T06:00:00Z"
      - --max-feedback-modified-at
      - "2026-10-01T18:00:00Z"
      - --page-size
      - "50"
      - --cursor
      - abc123
    response:
      headers: {Content-Type: text/event-stream}
      body: &events "event: data\ndata: [{\"op\":\"add\",\"path\":\"\",\"value\":{\"items\":[],\"next_cursor\":null}}]\n\nevent: data\ndata: [{\"op\":\"add\",\"path\":\"/items/-\",\"value\":{\"id\":\"55555555-5555-5555-5555-555555555555\",\"name\":\"agent\"}}]\n\nevent: data\ndata: [{\"op\":\"replace\",\"path\":\"/next_cursor\",\"value\":\"def456\"}]\n\nevent: end\ndata: \n\n"
    want:
      method: POST
      path: /api/v2/runs/query
      headers: {Accept: text/event-stream}
      body:
        project_ids: [11111111-1111-1111-1111-111111111111, 22222222-2222-2222-2222-222222222222]
        ai_search: the tool call failed
        filter: eq(status, "error")
        trace_filter: has(tags, "production")
        tree_filter: eq(name, "retriever")
        trace_id: 33333333-3333-3333-3333-333333333333
        ids: [55555555-5555-5555-5555-555555555555]
        reference_examples: [66666666-6666-6666-6666-666666666666]
        run_type: LLM
        is_root: true
        has_error: true
        selects: [ID, NAME]
        min_start_time: "2026-10-01T00:00:00Z"
        max_start_time: "2026-10-02T00:00:00Z"
        min_feedback_modified_at: "2026-10-01T06:00:00Z"
        max_feedback_modified_at: "2026-10-01T18:00:00Z"
        page_size: 50
        cursor: abc123
      stdout: '"path": "/items/-"'

  # Runs after the case above, so it also shows flag values do not carry over.
  - name: query-v2 sends only the flags given
    op: query-v2
    args: [--project-id, 11111111-1111-1111-1111-111111111111]
    response:
      headers: {Content-Type: text/event-stream}
      body: *events
    want:
      method: POST
      path: /api/v2/runs/query
      headers: {Accept: text/event-stream}
      body: {project_ids: [11111111-1111-1111-1111-111111111111]}
      stdout: '"value": "def456"'

  # project_ids and reference_dataset_id are mutually exclusive.
  - name: query-v2 by reference dataset in a workspace
    op: query-v2
    args:
      - --reference-dataset-id
      - 77777777-7777-7777-7777-777777777777
      - --workspace
      - 44444444-4444-4444-4444-444444444444
    response:
      headers: {Content-Type: text/event-stream}
      body: *events
    want:
      method: POST
      path: /api/v2/runs/query
      headers: {Accept: text/event-stream, X-Tenant-Id: 44444444-4444-4444-4444-444444444444}
      body: {reference_dataset_id: 77777777-7777-7777-7777-777777777777}
      stdout: 55555555-5555-5555-5555-555555555555

  - name: query-v2 reports error events
    op: query-v2
    args: [--project-id, 11111111-1111-1111-1111-111111111111, --filter, eq(]
    response:
      headers: {Content-Type: text/event-stream}
      body: "event: data\ndata: [{\"op\":\"add\",\"path\":\"\",\"value\":{\"items\":[],\"next_cursor\":null}}]\n\nevent: error\ndata: {\"type\":\"about:blank\",\"title\":\"Bad Request\",\"status\":400,\"detail\":\"invalid filter\",\"instance\":\"/api/v2/runs/query\"}\n\n"
    want:
      method: POST
      path: /api/v2/runs/query
      body: {project_ids: [11111111-1111-1111-1111-111111111111], filter: eq(}
      exit_code: 1
      stderr: invalid filter

  - name: query-v2 reports API errors
    op: query-v2
    args: [--project-id, 11111111-1111-1111-1111-111111111111, --page-size, "5000"]
    response:
      status: 400
      headers: {Content-Type: application/problem+json}
      body: {type: about:blank, title: Bad Request, status: 400, detail: page_size must be between 1 and 1000}
    want:
      method: POST
      path: /api/v2/runs/query
      body: {project_ids: [11111111-1111-1111-1111-111111111111], page_size: 5000}
      exit_code: 1
      stderr: 400 Bad Request

lifecycle_skip: "Read-only queries over runs, which the CLI cannot delete; runs are ingested through the SDKs."
