# Tests for `langsmith sandboxes registries`. Contract cases run against a fake API.
resource: sandboxes:registries

contract:
  - name: create with registry credentials
    op: create
    args: [--name, private-images, --url, registry.example.com, --auth-type, DOCKER_CONFIG, --username, robot, --password, example-password]
    response:
      status: 201
      body: &registry
        id: 11111111-1111-1111-1111-111111111111
        name: private-images
        url: registry.example.com
        auth_type: DOCKER_CONFIG
    want:
      method: POST
      path: /api/v2/sandboxes/registries
      body: {name: private-images, url: registry.example.com, auth_type: DOCKER_CONFIG, username: robot, password: example-password}
      stdout: 11111111-1111-1111-1111-111111111111

  - name: create with a role sends only the new flags
    op: create
    args: [--name, ecr-images, --url, 123456789012.dkr.ecr.us-east-1.amazonaws.com, --auth-type, AWS_ROLE, --aws-role-arn, "arn:aws:iam::123456789012:role/example"]
    response:
      status: 201
      body: {id: 22222222-2222-2222-2222-222222222222, name: ecr-images, auth_type: AWS_ROLE}
    want:
      method: POST
      path: /api/v2/sandboxes/registries
      body: {name: ecr-images, url: 123456789012.dkr.ecr.us-east-1.amazonaws.com, auth_type: AWS_ROLE, aws_role_arn: "arn:aws:iam::123456789012:role/example"}

  - name: create reports API errors
    op: create
    args: [--name, Private Images, --url, registry.example.com]
    response:
      status: 422
      body: {detail: invalid registry name}
    want:
      method: POST
      path: /api/v2/sandboxes/registries
      body: {name: Private Images, url: registry.example.com}
      exit_code: 1
      stderr: 422 Unprocessable Entity

  - name: list with filters in a workspace
    op: list
    args: [--name-contains, private, --page-size, "10", --cursor, opaque-cursor, --workspace, 44444444-4444-4444-4444-444444444444]
    response:
      body: {items: [*registry], next_cursor: null}
    want:
      method: GET
      path: /api/v2/sandboxes/registries
      headers: {X-Tenant-Id: 44444444-4444-4444-4444-444444444444}
      query: {name_contains: private, page_size: "10", cursor: opaque-cursor}
      stdout: private-images

  - name: retrieve
    op: retrieve
    args: [--name, private-images]
    response:
      body: *registry
    want:
      method: GET
      path: /api/v2/sandboxes/registries/private-images
      stdout: registry.example.com

  # The registry is --name; its new name in the body is --new-name.
  - name: update with every field
    op: update
    args: [--name, private-images, --new-name, team-images, --url, registry2.example.com, --auth-type, DOCKER_CONFIG, --username, robot2, --password, new-password]
    response:
      body: *registry
    want:
      method: PATCH
      path: /api/v2/sandboxes/registries/private-images
      body: {name: team-images, url: registry2.example.com, auth_type: DOCKER_CONFIG, username: robot2, password: new-password}
      stdout: 11111111-1111-1111-1111-111111111111

  # Runs after the case above, so it also shows flag values do not carry over.
  - name: update sends only the flags given
    op: update
    args: [--name, ecr-images, --aws-role-arn, "arn:aws:iam::123456789012:role/other", --workspace, 44444444-4444-4444-4444-444444444444]
    response:
      body: *registry
    want:
      method: PATCH
      path: /api/v2/sandboxes/registries/ecr-images
      headers: {X-Tenant-Id: 44444444-4444-4444-4444-444444444444}
      body: {aws_role_arn: "arn:aws:iam::123456789012:role/other"}

  - name: update reports API errors
    op: update
    args: [--name, missing, --new-name, other]
    response:
      status: 404
      body: {detail: registry not found}
    want:
      method: PATCH
      path: /api/v2/sandboxes/registries/missing
      body: {name: other}
      exit_code: 1
      stderr: 404 Not Found

  - name: delete after confirmation
    op: delete
    args: [--name, private-images]
    stdin: "y\n"
    response:
      status: 204
    want:
      method: DELETE
      path: /api/v2/sandboxes/registries/private-images
      stderr: This permanently deletes

  - name: delete without confirmation sends nothing
    op: delete
    args: [--name, private-images]
    stdin: "n\n"
    want:
      requests: 0
      error: not confirmed

  - name: delete with --yes skips the prompt
    op: delete
    args: [--name, private-images, --yes]
    response:
      status: 204
    want:
      method: DELETE
      path: /api/v2/sandboxes/registries/private-images

lifecycle_skip: "A registry holds image pull credentials that every sandbox in the workspace can use, so it is not created by a live test."
