# Tests for `langsmith projects insights`. Contract cases run against a fake API.
resource: sessions:insights

contract:
  - name: update
    op: update
    args:
      - --session-id
      - 11111111-1111-1111-1111-111111111111
      - --job-id
      - 22222222-2222-2222-2222-222222222222
      - --name
      - Weekly report
    response:
      body: {name: Weekly report, status: success}
    want:
      method: PATCH
      path: /api/v1/sessions/11111111-1111-1111-1111-111111111111/insights/22222222-2222-2222-2222-222222222222
      body: {name: Weekly report}
      stdout: Weekly report

  - name: update in a workspace
    op: update
    args:
      - --session-id
      - 11111111-1111-1111-1111-111111111111
      - --job-id
      - 22222222-2222-2222-2222-222222222222
      - --name
      - Renamed
      - --workspace
      - 44444444-4444-4444-4444-444444444444
    response:
      body: {name: Renamed, status: success}
    want:
      method: PATCH
      path: /api/v1/sessions/11111111-1111-1111-1111-111111111111/insights/22222222-2222-2222-2222-222222222222
      headers: {X-Tenant-Id: 44444444-4444-4444-4444-444444444444}
      body: {name: Renamed}

  - name: update requires a name
    op: update
    args: [--session-id, 11111111-1111-1111-1111-111111111111, --job-id, 22222222-2222-2222-2222-222222222222]
    want:
      requests: 0
      exit_code: 1
      stderr: Required flag "name" not set

  - name: update reports API errors
    op: update
    args:
      - --session-id
      - 11111111-1111-1111-1111-111111111111
      - --job-id
      - 22222222-2222-2222-2222-222222222222
      - --name
      - Renamed
    response:
      status: 404
      body: {detail: Job not found}
    want:
      method: PATCH
      path: /api/v1/sessions/11111111-1111-1111-1111-111111111111/insights/22222222-2222-2222-2222-222222222222
      body: {name: Renamed}
      exit_code: 1
      stderr: 404 Not Found

  - name: retrieve runs with every filter
    op: retrieve-runs
    args:
      - --session-id
      - 11111111-1111-1111-1111-111111111111
      - --job-id
      - 22222222-2222-2222-2222-222222222222
      - --cluster-id
      - 33333333-3333-3333-3333-333333333333
      - --attribute-sort-key
      - score
      - --attribute-sort-order
      - desc
      - --limit
      - "10"
      - --offset
      - "20"
    response:
      body: {runs: [{id: 55555555-5555-5555-5555-555555555555}], offset: 30}
    want:
      method: GET
      path: /api/v1/sessions/11111111-1111-1111-1111-111111111111/insights/22222222-2222-2222-2222-222222222222/runs
      query:
        cluster_id: 33333333-3333-3333-3333-333333333333
        attribute_sort_key: score
        attribute_sort_order: desc
        limit: "10"
        offset: "20"
      stdout: 55555555-5555-5555-5555-555555555555

  # Runs after the case above, so it also shows flag values do not carry over.
  - name: retrieve runs without filters
    op: retrieve-runs
    args: [--session-id, 11111111-1111-1111-1111-111111111111, --job-id, 22222222-2222-2222-2222-222222222222]
    response:
      body: {runs: [], offset: null}
    want:
      method: GET
      path: /api/v1/sessions/11111111-1111-1111-1111-111111111111/insights/22222222-2222-2222-2222-222222222222/runs

  - name: delete after confirmation
    op: delete
    args: [--session-id, 11111111-1111-1111-1111-111111111111, --job-id, 22222222-2222-2222-2222-222222222222]
    stdin: "y\n"
    response:
      body: {id: 22222222-2222-2222-2222-222222222222, message: Job deleted}
    want:
      method: DELETE
      path: /api/v1/sessions/11111111-1111-1111-1111-111111111111/insights/22222222-2222-2222-2222-222222222222
      stderr: This permanently deletes

  - name: delete without confirmation sends nothing
    op: delete
    args: [--session-id, 11111111-1111-1111-1111-111111111111, --job-id, 22222222-2222-2222-2222-222222222222]
    stdin: "n\n"
    want:
      requests: 0
      error: not confirmed

  - name: delete with --yes skips the prompt
    op: delete
    args: [--session-id, 11111111-1111-1111-1111-111111111111, --job-id, 22222222-2222-2222-2222-222222222222, --yes]
    response:
      body: {id: 22222222-2222-2222-2222-222222222222, message: Job deleted}
    want:
      method: DELETE
      path: /api/v1/sessions/11111111-1111-1111-1111-111111111111/insights/22222222-2222-2222-2222-222222222222

lifecycle_skip: "Operates on Insights jobs, which these generated commands cannot create; creating one runs an LLM analysis over a project's traces."
