# Tests for `langsmith examples bulk`. Contract cases run against a fake API.
resource: examples:bulk

contract:
  - name: create with every field
    op: create
    args:
      - --body
      - >-
        {dataset_id: 22222222-2222-2222-2222-222222222222,
        id: 11111111-1111-1111-1111-111111111111,
        created_at: "2026-10-01T00:00:00Z",
        inputs: {question: What is LangSmith},
        reference_outputs: {answer: A platform},
        metadata: {source: docs, rank: -1},
        split: [train, test],
        source_run_id: 55555555-5555-5555-5555-555555555555,
        source_run_start_time: "2026-10-01T00:00:00Z",
        source_session_id: 66666666-6666-6666-6666-666666666666,
        source_trace_id: 77777777-7777-7777-7777-777777777777,
        use_source_run_io: false,
        use_source_run_attachments: [image.png],
        use_legacy_message_format: true}
      - --body
      - "{dataset_id: 22222222-2222-2222-2222-222222222222, inputs: {question: Second}}"
    response:
      body: &examples
        - id: 11111111-1111-1111-1111-111111111111
          dataset_id: 22222222-2222-2222-2222-222222222222
          inputs: {question: What is LangSmith}
          created_at: "2026-10-01T00:00:00Z"
          modified_at: "2026-10-01T00:00:00Z"
    want:
      method: POST
      path: /api/v1/examples/bulk
      body:
        - dataset_id: 22222222-2222-2222-2222-222222222222
          id: 11111111-1111-1111-1111-111111111111
          created_at: "2026-10-01T00:00:00Z"
          inputs: {question: What is LangSmith}
          reference_outputs: {answer: A platform}
          metadata: {source: docs, rank: -1}
          split: [train, test]
          source_run_id: 55555555-5555-5555-5555-555555555555
          source_run_start_time: "2026-10-01T00:00:00Z"
          source_session_id: 66666666-6666-6666-6666-666666666666
          source_trace_id: 77777777-7777-7777-7777-777777777777
          use_source_run_io: false
          use_source_run_attachments: [image.png]
          use_legacy_message_format: true
        - dataset_id: 22222222-2222-2222-2222-222222222222
          inputs: {question: Second}
      stdout: 11111111-1111-1111-1111-111111111111

  # Runs after the case above, so it also shows flag values do not carry over.
  - name: create with one example in a workspace
    op: create
    args: [--body, "{dataset_id: 22222222-2222-2222-2222-222222222222}", --workspace, 44444444-4444-4444-4444-444444444444]
    response:
      body: *examples
    want:
      method: POST
      path: /api/v1/examples/bulk
      headers: {X-Tenant-Id: 44444444-4444-4444-4444-444444444444}
      body: [{dataset_id: 22222222-2222-2222-2222-222222222222}]

  - name: create reports API errors
    op: create
    args: [--body, "{dataset_id: 22222222-2222-2222-2222-222222222222}"]
    response:
      status: 422
      body: {detail: Invalid example}
    want:
      method: POST
      path: /api/v1/examples/bulk
      body: [{dataset_id: 22222222-2222-2222-2222-222222222222}]
      exit_code: 1
      stderr: 422 Unprocessable Entity

lifecycle_skip: "Needs a dataset, which these generated commands cannot create."
