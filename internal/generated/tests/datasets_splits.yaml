# Tests for `langsmith datasets splits`. Contract cases run against a fake API.
resource: datasets:splits

contract:
  - name: retrieve
    op: retrieve
    args: [--dataset-id, 11111111-1111-1111-1111-111111111111]
    response:
      body: [base, test]
    want:
      method: GET
      path: /api/v1/datasets/11111111-1111-1111-1111-111111111111/splits
      stdout: test

  - name: retrieve at a version
    op: retrieve
    args: [--dataset-id, 11111111-1111-1111-1111-111111111111, --as-of, v1]
    response:
      body: [base]
    want:
      method: GET
      path: /api/v1/datasets/11111111-1111-1111-1111-111111111111/splits
      query: {as_of: v1}

  # A missing dataset returns an empty list, so the error case is a key without
  # read access to datasets.
  - name: retrieve reports API errors
    op: retrieve
    args: [--dataset-id, 11111111-1111-1111-1111-111111111111]
    response:
      status: 403
      body: {detail: Forbidden}
    want:
      method: GET
      path: /api/v1/datasets/11111111-1111-1111-1111-111111111111/splits
      exit_code: 1
      stderr: 403 Forbidden

  - name: create with every flag
    op: create
    args:
      - --dataset-id
      - 11111111-1111-1111-1111-111111111111
      - --split-name
      - test
      - --example
      - 22222222-2222-2222-2222-222222222222
      - --example
      - 33333333-3333-3333-3333-333333333333
      - --remove
    response:
      body: [22222222-2222-2222-2222-222222222222, 33333333-3333-3333-3333-333333333333]
    want:
      method: PUT
      path: /api/v1/datasets/11111111-1111-1111-1111-111111111111/splits
      body:
        split_name: test
        examples: [22222222-2222-2222-2222-222222222222, 33333333-3333-3333-3333-333333333333]
        remove: true
      stdout: 33333333-3333-3333-3333-333333333333

  # Runs after the case above, so it also shows flag values do not carry over.
  - name: create with one example
    op: create
    args:
      - --dataset-id
      - 11111111-1111-1111-1111-111111111111
      - --split-name
      - train
      - --example
      - 22222222-2222-2222-2222-222222222222
      - --workspace
      - 44444444-4444-4444-4444-444444444444
    response:
      body: [22222222-2222-2222-2222-222222222222]
    want:
      method: PUT
      path: /api/v1/datasets/11111111-1111-1111-1111-111111111111/splits
      headers: {X-Tenant-Id: 44444444-4444-4444-4444-444444444444}
      body:
        split_name: train
        examples: [22222222-2222-2222-2222-222222222222]

  - name: create requires a split name
    op: create
    args: [--dataset-id, 11111111-1111-1111-1111-111111111111, --example, 22222222-2222-2222-2222-222222222222]
    want:
      requests: 0
      exit_code: 1
      stderr: split-name

lifecycle_skip: "Splits are set on examples, which these commands cannot create; examples are added with the hand-written examples commands."
