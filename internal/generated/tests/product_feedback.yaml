# Tests for `langsmith product-feedback`. Contract cases run against a fake API.
resource: product-feedback

contract:
  - name: retrieve
    op: retrieve
    args: [--id, 11111111-1111-1111-1111-111111111111]
    response:
      body: &feedback
        id: 11111111-1111-1111-1111-111111111111
        category: usability
        message: The list output is hard to scan.
        source: cli
        created_at: "2026-10-01T00:00:00Z"
    want:
      method: GET
      path: /api/v1/platform/product-feedbacks/11111111-1111-1111-1111-111111111111
      stdout: The list output is hard to scan.

  - name: retrieve in a workspace
    op: retrieve
    args: [--id, 11111111-1111-1111-1111-111111111111, --workspace, 44444444-4444-4444-4444-444444444444]
    response:
      body: *feedback
    want:
      method: GET
      path: /api/v1/platform/product-feedbacks/11111111-1111-1111-1111-111111111111
      headers: {X-Tenant-Id: 44444444-4444-4444-4444-444444444444}
      stdout: '"category": "usability"'

  - name: retrieve reports API errors
    op: retrieve
    args: [--id, 11111111-1111-1111-1111-111111111111]
    response:
      status: 404
      body: {detail: product feedback not found}
    want:
      method: GET
      path: /api/v1/platform/product-feedbacks/11111111-1111-1111-1111-111111111111
      exit_code: 1
      stderr: 404 Not Found

lifecycle_skip: "Product feedback is created with `langsmith report`, which sends a note to the LangSmith team; the generated command only reads it back."
