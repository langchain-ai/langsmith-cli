# Tests for `langsmith annotation-queues items`. Contract cases run against a
# fake API.
resource: annotation-queues:items

contract:
  - name: create with run and thread items
    op: create
    args:
      - --queue-id
      - 11111111-1111-1111-1111-111111111111
      - --extend-trace-retention
      - --item
      - "{item_type: RUN, run_id: 22222222-2222-2222-2222-222222222222, start_time: '2026-10-01T00:00:00Z'}"
      - --item
      - "{item_type: THREAD, thread_id: thread-1, project_id: 33333333-3333-3333-3333-333333333333}"
    response:
      status: 201
      body:
        items:
          - &item
            id: 44444444-4444-4444-4444-444444444444
            queue_id: 11111111-1111-1111-1111-111111111111
            item_type: RUN
            run_id: 22222222-2222-2222-2222-222222222222
            added_at: "2026-10-01T00:00:00Z"
    want:
      method: POST
      path: /api/v1/platform/annotation-queues/11111111-1111-1111-1111-111111111111/items
      query: {extend_trace_retention: "true"}
      body:
        items:
          - {item_type: RUN, run_id: 22222222-2222-2222-2222-222222222222, start_time: "2026-10-01T00:00:00Z"}
          - {item_type: THREAD, thread_id: thread-1, project_id: 33333333-3333-3333-3333-333333333333}
      stdout: 44444444-4444-4444-4444-444444444444

  # Runs after the case above, so it also shows flag values do not carry over.
  - name: create with one item
    op: create
    args:
      - --queue-id
      - 11111111-1111-1111-1111-111111111111
      - --item
      - "{item_type: RUN, run_id: 22222222-2222-2222-2222-222222222222}"
    response:
      status: 201
      body: {items: [*item]}
    want:
      method: POST
      path: /api/v1/platform/annotation-queues/11111111-1111-1111-1111-111111111111/items
      body:
        items: [{item_type: RUN, run_id: 22222222-2222-2222-2222-222222222222}]

  - name: create reports API errors
    op: create
    args:
      - --queue-id
      - 11111111-1111-1111-1111-111111111111
      - --item
      - "{item_type: RUN}"
    response:
      status: 400
      body: {detail: run_id is required for RUN items}
    want:
      method: POST
      path: /api/v1/platform/annotation-queues/11111111-1111-1111-1111-111111111111/items
      body: {items: [{item_type: RUN}]}
      exit_code: 1
      stderr: 400 Bad Request

  - name: list a review section in a workspace
    op: list
    args:
      - --workspace
      - 55555555-5555-5555-5555-555555555555
      - --queue-id
      - 11111111-1111-1111-1111-111111111111
      - --status
      - archived
      - --item-type
      - RUN
      - --page-size
      - "10"
      - --min-start-time
      - "2026-10-01T00:00:00Z"
    response:
      body: {items: [*item], next_cursor: null}
    want:
      method: GET
      path: /api/v1/platform/annotation-queues/11111111-1111-1111-1111-111111111111/items
      query:
        status: archived
        item_type: RUN
        page_size: "10"
        min_start_time: "2026-10-01T00:00:00Z"
      headers: {X-Tenant-Id: 55555555-5555-5555-5555-555555555555}
      stdout: 44444444-4444-4444-4444-444444444444

  - name: update timestamps
    op: update
    args:
      - --queue-id
      - 11111111-1111-1111-1111-111111111111
      - --item-id
      - 44444444-4444-4444-4444-444444444444
      - --added-at
      - "2026-10-02T00:00:00Z"
      - --last-reviewed-time
      - "2026-10-03T00:00:00Z"
    response:
      body: *item
    want:
      method: PATCH
      path: /api/v1/platform/annotation-queues/11111111-1111-1111-1111-111111111111/items/44444444-4444-4444-4444-444444444444
      body: {added_at: "2026-10-02T00:00:00Z", last_reviewed_time: "2026-10-03T00:00:00Z"}
      stdout: 44444444-4444-4444-4444-444444444444

  - name: update sends only the flags given
    op: update
    args:
      - --queue-id
      - 11111111-1111-1111-1111-111111111111
      - --item-id
      - 44444444-4444-4444-4444-444444444444
      - --added-at
      - "2026-10-04T00:00:00Z"
    response:
      body: *item
    want:
      method: PATCH
      path: /api/v1/platform/annotation-queues/11111111-1111-1111-1111-111111111111/items/44444444-4444-4444-4444-444444444444
      body: {added_at: "2026-10-04T00:00:00Z"}

  - name: create-status marks an item completed
    op: create-status
    args:
      - --queue-item-id
      - 44444444-4444-4444-4444-444444444444
      - --status
      - completed
      - --override-added-at
      - "2026-10-02T00:00:00Z"
    response:
      body:
        queue_item_id: 44444444-4444-4444-4444-444444444444
        status: completed
        is_archived: true
    want:
      method: POST
      path: /api/v1/platform/annotation-queues/items/44444444-4444-4444-4444-444444444444/status
      body: {status: completed, override_added_at: "2026-10-02T00:00:00Z"}
      stdout: '"is_archived": true'

  - name: retrieve-count for archived items in a window
    op: retrieve-count
    args:
      - --queue-id
      - 11111111-1111-1111-1111-111111111111
      - --status
      - archived
      - --start-time
      - "2026-10-01T00:00:00Z"
      - --end-time
      - "2026-10-02T00:00:00Z"
    response:
      body: {count: 7}
    want:
      method: GET
      path: /api/v1/platform/annotation-queues/11111111-1111-1111-1111-111111111111/items/count
      query:
        status: archived
        start_time: "2026-10-01T00:00:00Z"
        end_time: "2026-10-02T00:00:00Z"
      stdout: '"count": 7'

  - name: retrieve-placement
    op: retrieve-placement
    args:
      - --queue-id
      - 11111111-1111-1111-1111-111111111111
      - --item-id
      - 44444444-4444-4444-4444-444444444444
    response:
      body: {section: needs_my_review, position: 3, item_type: RUN, cursor: abc}
    want:
      method: GET
      path: /api/v1/platform/annotation-queues/11111111-1111-1111-1111-111111111111/items/44444444-4444-4444-4444-444444444444/placement
      stdout: needs_my_review

  - name: delete-all after confirmation
    op: delete-all
    args:
      - --queue-id
      - 11111111-1111-1111-1111-111111111111
      - --item-id
      - 44444444-4444-4444-4444-444444444444
      - --item-id
      - 66666666-6666-6666-6666-666666666666
    stdin: "y\n"
    want:
      method: POST
      path: /api/v1/platform/annotation-queues/11111111-1111-1111-1111-111111111111/items/delete
      body:
        item_ids: [44444444-4444-4444-4444-444444444444, 66666666-6666-6666-6666-666666666666]
      stderr: This permanently deletes

  - name: delete-all without confirmation sends nothing
    op: delete-all
    args:
      - --queue-id
      - 11111111-1111-1111-1111-111111111111
      - --item-id
      - 44444444-4444-4444-4444-444444444444
    stdin: "n\n"
    want:
      requests: 0
      error: not confirmed

  - name: delete-all with --yes skips the prompt
    op: delete-all
    args:
      - --queue-id
      - 11111111-1111-1111-1111-111111111111
      - --item-id
      - 44444444-4444-4444-4444-444444444444
      - --yes
    want:
      method: POST
      path: /api/v1/platform/annotation-queues/11111111-1111-1111-1111-111111111111/items/delete
      body: {item_ids: [44444444-4444-4444-4444-444444444444]}

lifecycle_skip: "Items reference existing runs or threads, which the CLI cannot create, and the CLI cannot create the queue they go in."
