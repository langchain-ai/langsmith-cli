# Tests for `langsmith runs`. Contract cases run against a fake API.
resource: runs

contract:
  - name: get-url with every field
    op: get-url
    args:
      - --run-id
      - 22222222-2222-2222-2222-222222222222
      - --project-id
      - 11111111-1111-1111-1111-111111111111
      - --trace-id
      - 33333333-3333-3333-3333-333333333333
      - --start-time
      - "2026-10-01T00:00:00Z"
    response:
      body: &url {url: "https://smith.example.com/o/x/projects/p/11111111-1111-1111-1111-111111111111/r/22222222-2222-2222-2222-222222222222"}
    want:
      method: GET
      path: /api/v2/runs/22222222-2222-2222-2222-222222222222/url
      query:
        project_id: 11111111-1111-1111-1111-111111111111
        trace_id: 33333333-3333-3333-3333-333333333333
        start_time: "2026-10-01T00:00:00Z"
      stdout: /r/22222222-2222-2222-2222-222222222222

  # Runs after the case above, so it also shows flag values do not carry over.
  - name: get-url without the optional start time
    op: get-url
    args:
      - --run-id
      - 22222222-2222-2222-2222-222222222222
      - --project-id
      - 11111111-1111-1111-1111-111111111111
      - --trace-id
      - 33333333-3333-3333-3333-333333333333
      - --workspace
      - 44444444-4444-4444-4444-444444444444
    response:
      body: *url
    want:
      method: GET
      path: /api/v2/runs/22222222-2222-2222-2222-222222222222/url
      headers: {X-Tenant-Id: 44444444-4444-4444-4444-444444444444}
      query:
        project_id: 11111111-1111-1111-1111-111111111111
        trace_id: 33333333-3333-3333-3333-333333333333

  - name: get-url reports API errors
    op: get-url
    args:
      - --run-id
      - 22222222-2222-2222-2222-222222222222
      - --project-id
      - 11111111-1111-1111-1111-111111111111
      - --trace-id
      - 33333333-3333-3333-3333-333333333333
    response:
      status: 404
      body: {detail: Run not found}
    want:
      method: GET
      path: /api/v2/runs/22222222-2222-2222-2222-222222222222/url
      exit_code: 1
      stderr: 404 Not Found

  - name: --yes is rejected outside delete
    op: get-url
    args: [--run-id, 22222222-2222-2222-2222-222222222222, --project-id, 11111111-1111-1111-1111-111111111111, --trace-id, 33333333-3333-3333-3333-333333333333, --yes]
    want:
      requests: 0
      exit_code: 1
      stderr: "yes"

  - name: create with every flag type
    op: create
    args:
      - --id
      - 55555555-5555-5555-5555-555555555555
      - --trace-id
      - 55555555-5555-5555-5555-555555555555
      - --dotted-order
      - 20261001T000000000000Z55555555-5555-5555-5555-555555555555
      - --session-id
      - 11111111-1111-1111-1111-111111111111
      - --name
      - my-chain
      - --run-type
      - chain
      - --start-time
      - "2026-10-01T00:00:00Z"
      - --end-time
      - "2026-10-01T00:00:01Z"
      - --status
      - success
      - --inputs
      - '{question: hi}'
      - --outputs
      - '{answer: hello, score: -1.5}'
      - --extra
      - '{metadata: {env: test}}'
      - --event
      - '{name: start, time: "2026-10-01T00:00:00Z"}'
      - --event
      - '{name: end, time: "2026-10-01T00:00:01Z"}'
      - --tag
      - a
      - --tag
      - b
    response:
      status: 202
      body: &accepted {message: Run created}
    want:
      method: POST
      path: /api/v1/runs
      body:
        id: 55555555-5555-5555-5555-555555555555
        trace_id: 55555555-5555-5555-5555-555555555555
        dotted_order: 20261001T000000000000Z55555555-5555-5555-5555-555555555555
        session_id: 11111111-1111-1111-1111-111111111111
        name: my-chain
        run_type: chain
        start_time: "2026-10-01T00:00:00Z"
        end_time: "2026-10-01T00:00:01Z"
        status: success
        inputs: {question: hi}
        outputs: {answer: hello, score: -1.5}
        extra: {metadata: {env: test}}
        events:
          - {name: start, time: "2026-10-01T00:00:00Z"}
          - {name: end, time: "2026-10-01T00:00:01Z"}
        tags: [a, b]
      stdout: Run created

  # Runs after the case above, so it also shows flag values do not carry over.
  - name: create with a few flags and a project name
    op: create
    args:
      - --name
      - my-tool
      - --run-type
      - tool
      - --session-name
      - my-project
      - --workspace
      - 44444444-4444-4444-4444-444444444444
    response:
      status: 202
      body: *accepted
    want:
      method: POST
      path: /api/v1/runs
      headers: {X-Tenant-Id: 44444444-4444-4444-4444-444444444444}
      body: {name: my-tool, run_type: tool, session_name: my-project}

  - name: create reports API errors
    op: create
    args: [--name, my-chain, --run-type, chain]
    response:
      status: 400
      body: {error: invalid run}
    want:
      method: POST
      path: /api/v1/runs
      body: {name: my-chain, run_type: chain}
      exit_code: 1
      stderr: 400 Bad Request

  - name: ingest-batch with post and patch runs
    op: ingest-batch
    args:
      - --post
      - '{id: 55555555-5555-5555-5555-555555555555, trace_id: 55555555-5555-5555-5555-555555555555, dotted_order: 20261001T000000000000Z55555555-5555-5555-5555-555555555555, session_name: my-project, name: parent, run_type: chain, start_time: "2026-10-01T00:00:00Z", inputs: {q: hi}, tags: [a]}'
      - --post
      - '{id: 66666666-6666-6666-6666-666666666666, trace_id: 55555555-5555-5555-5555-555555555555, parent_run_id: 55555555-5555-5555-5555-555555555555, dotted_order: 20261001T000000000000Z55555555-5555-5555-5555-555555555555.20261001T000000000001Z66666666-6666-6666-6666-666666666666, session_name: my-project, name: child, run_type: llm, start_time: "2026-10-01T00:00:00Z"}'
      - --patch
      - '{id: 77777777-7777-7777-7777-777777777777, trace_id: 77777777-7777-7777-7777-777777777777, dotted_order: 20261001T000000000000Z77777777-7777-7777-7777-777777777777, end_time: "2026-10-01T00:00:02Z", outputs: {a: 1}, error: boom}'
    response:
      status: 202
      body: {message: Runs batch ingested}
    want:
      method: POST
      path: /api/v1/runs/batch
      body:
        post:
          - id: 55555555-5555-5555-5555-555555555555
            trace_id: 55555555-5555-5555-5555-555555555555
            dotted_order: 20261001T000000000000Z55555555-5555-5555-5555-555555555555
            session_name: my-project
            name: parent
            run_type: chain
            start_time: "2026-10-01T00:00:00Z"
            inputs: {q: hi}
            tags: [a]
          - id: 66666666-6666-6666-6666-666666666666
            trace_id: 55555555-5555-5555-5555-555555555555
            parent_run_id: 55555555-5555-5555-5555-555555555555
            dotted_order: 20261001T000000000000Z55555555-5555-5555-5555-555555555555.20261001T000000000001Z66666666-6666-6666-6666-666666666666
            session_name: my-project
            name: child
            run_type: llm
            start_time: "2026-10-01T00:00:00Z"
        patch:
          - id: 77777777-7777-7777-7777-777777777777
            trace_id: 77777777-7777-7777-7777-777777777777
            dotted_order: 20261001T000000000000Z77777777-7777-7777-7777-777777777777
            end_time: "2026-10-01T00:00:02Z"
            outputs: {a: 1}
            error: boom
      stdout: Runs batch ingested

  # Runs after the case above, so it also shows flag values do not carry over.
  - name: ingest-batch with only a patch
    op: ingest-batch
    args:
      - --patch
      - '{id: 77777777-7777-7777-7777-777777777777, end_time: "2026-10-01T00:00:03Z"}'
      - --workspace
      - 44444444-4444-4444-4444-444444444444
    response:
      status: 202
      body: {message: Runs batch ingested}
    want:
      method: POST
      path: /api/v1/runs/batch
      headers: {X-Tenant-Id: 44444444-4444-4444-4444-444444444444}
      body:
        patch:
          - {id: 77777777-7777-7777-7777-777777777777, end_time: "2026-10-01T00:00:03Z"}

  - name: ingest-batch reports API errors
    op: ingest-batch
    args: [--post, '{name: x}']
    response:
      status: 403
      body: {error: forbidden}
    want:
      method: POST
      path: /api/v1/runs/batch
      body: {post: [{name: x}]}
      exit_code: 1
      stderr: 403 Forbidden

lifecycle_skip: "Run ingestion is asynchronous, so a run written by create or ingest-batch is not readable at once, and the CLI cannot delete runs; get-url also needs the trace and project of an existing run."
