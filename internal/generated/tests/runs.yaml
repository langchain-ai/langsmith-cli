# Tests for `langsmith runs`. Contract cases run against a fake API.
resource: runs

contract:
  - name: get-url with every field
    op: get-url
    args:
      - --run-id
      - 22222222-2222-2222-2222-222222222222
      - --project-id
      - 11111111-1111-1111-1111-111111111111
      - --trace-id
      - 33333333-3333-3333-3333-333333333333
      - --start-time
      - "2026-10-01T00:00:00Z"
    response:
      body: &url {url: "https://smith.example.com/o/x/projects/p/11111111-1111-1111-1111-111111111111/r/22222222-2222-2222-2222-222222222222"}
    want:
      method: GET
      path: /api/v2/runs/22222222-2222-2222-2222-222222222222/url
      query:
        project_id: 11111111-1111-1111-1111-111111111111
        trace_id: 33333333-3333-3333-3333-333333333333
        start_time: "2026-10-01T00:00:00Z"
      stdout: /r/22222222-2222-2222-2222-222222222222

  # Runs after the case above, so it also shows flag values do not carry over.
  - name: get-url without the optional start time
    op: get-url
    args:
      - --run-id
      - 22222222-2222-2222-2222-222222222222
      - --project-id
      - 11111111-1111-1111-1111-111111111111
      - --trace-id
      - 33333333-3333-3333-3333-333333333333
      - --workspace
      - 44444444-4444-4444-4444-444444444444
    response:
      body: *url
    want:
      method: GET
      path: /api/v2/runs/22222222-2222-2222-2222-222222222222/url
      headers: {X-Tenant-Id: 44444444-4444-4444-4444-444444444444}
      query:
        project_id: 11111111-1111-1111-1111-111111111111
        trace_id: 33333333-3333-3333-3333-333333333333

  - name: get-url reports API errors
    op: get-url
    args:
      - --run-id
      - 22222222-2222-2222-2222-222222222222
      - --project-id
      - 11111111-1111-1111-1111-111111111111
      - --trace-id
      - 33333333-3333-3333-3333-333333333333
    response:
      status: 404
      body: {detail: Run not found}
    want:
      method: GET
      path: /api/v2/runs/22222222-2222-2222-2222-222222222222/url
      exit_code: 1
      stderr: 404 Not Found

  - name: --yes is rejected outside delete
    op: get-url
    args: [--run-id, 22222222-2222-2222-2222-222222222222, --project-id, 11111111-1111-1111-1111-111111111111, --trace-id, 33333333-3333-3333-3333-333333333333, --yes]
    want:
      requests: 0
      exit_code: 1
      stderr: "yes"

lifecycle_skip: "Reads the URL of an existing run, which the CLI cannot create; runs are ingested through the SDKs."
