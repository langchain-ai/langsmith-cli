[project]
name = "managed-deepagents"
version = "0.0.0-stub"
requires-python = ">=3.11"
dependencies = [
"pydantic>=2.7.4,<2.15",
"httpx>=0.28.1,<1",
"typing-extensions>=4.12.2,<5",
"deepagents>=0.7.30,<1",
"langchain>=1.4.6,<2",
"langchain-core>=1.6.2,<2",
"langgraph>=1.2.15,<2",
"langgraph-prebuilt>=1.1.1,<2",
"langgraph-sdk>=0.4.6,<0.5",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
