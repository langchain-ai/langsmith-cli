# Support bot.
[project]
name = "support-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "managed-deepagents==0.0.0-stub",  # the SDK
    "httpx>=0.28",
    "langchain_openai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.uv.sources]
managed-deepagents = { path = "../sdk" }

[tool.ruff]
line-length = 100
