version: 2

builds:
  - id: langsmith
    main: ./cmd/langsmith
    binary: langsmith
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: >-
      langsmith_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt
  algorithm: sha256

# release-please creates the GitHub Release and writes its notes; GoReleaser
# attaches the archives and checksums to it.
release:
  mode: keep-existing

changelog:
  disable: true
